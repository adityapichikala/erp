name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma Migration Check (Dry Run)
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma migrate deploy --dry-run
